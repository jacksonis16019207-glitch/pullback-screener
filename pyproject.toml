[project]
name = "pullback-screener"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "jpholiday>=1.0.3",
    "numpy==2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "xlrd>=2.0.2",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "BLE",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["batch"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty]
environment.python-version = "3.15"