[project]
name = "pullback-screener"
version = "0.1.0"
description = "押し目買いの候補（押し目待ち・買い候補）を判定するバッチ"
requires-python = ">=3.15"
dependencies = [
    "jpholiday>=1.0.3",
    "numpy==2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "xlrd>=2.0.2",
    "yfinance>=1.7.0",
]

[project.scripts]
pullback-screener = "pullback_screener.screener:main"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pullback_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "BLE",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["batch"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty]
environment.python-version = "3.15"
